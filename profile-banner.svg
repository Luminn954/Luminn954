<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Kyross — Web and Android Projects</title>
  <desc id="desc">A cyan to violet banner for the Kyross GitHub profile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071a2f"/>
      <stop offset="52%" stop-color="#075985"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity=".15"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="260" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="28" fill="url(#grid)"/>
  <circle cx="1060" cy="35" r="190" fill="url(#glow)" opacity=".22"/>
  <circle cx="1110" cy="235" r="145" fill="#a78bfa" opacity=".14"/>
  <path d="M755 260 1010 0h190v260z" fill="#ffffff" opacity=".045"/>
  <path d="M810 260 1070 0" fill="none" stroke="#a5f3fc" stroke-opacity=".25" stroke-width="2"/>
  <text x="82" y="123" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="64" font-weight="700" letter-spacing="7">KYROSS</text>
  <rect x="86" y="150" width="70" height="4" rx="2" fill="#67e8f9"/>
  <text x="82" y="194" fill="#dbeafe" font-family="Segoe UI,Arial,sans-serif" font-size="22" letter-spacing="3">WEB &amp; ANDROID PROJECTS</text>
  <text x="1010" y="165" fill="#ffffff" font-family="Consolas,monospace" font-size="76" font-weight="700" opacity=".9">&lt;/&gt;</text>
  <circle cx="1090" cy="53" r="5" fill="#bae6fd"/>
  <circle cx="1120" cy="53" r="5" fill="#c4b5fd"/>
  <circle cx="1150" cy="53" r="5" fill="#f0abfc"/>
</svg>
